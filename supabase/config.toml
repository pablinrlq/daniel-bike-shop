# project_id é definido por `supabase link --project-ref <ref>` ao apontar
# para o novo projeto. Veja SETUP.md.
project_id = "tswnprstidgeojdovsuz"

# Bling OAuth callback é chamado pelo servidor da Bling — não há JWT do Supabase.
[functions.bling-oauth-callback]
verify_jwt = false

# Demais funções Bling exigem usuário autenticado.
# A validação de papel admin/editor acontece dentro da função.
[functions.bling-check-connection]
verify_jwt = true

[functions.bling-sync-products]
verify_jwt = true

# Criação de pedido e validação de estoque acontecem no checkout
# (usuário anônimo). Proteção contra abuso é feita dentro da função
# (idempotência + validação de payload).
[functions.bling-create-order]
verify_jwt = false

[functions.bling-validate-stock]
verify_jwt = false

# Validação de cupom (anon-callable, valida via RPC).
[functions.validate-coupon]
verify_jwt = false

# Mercado Pago — criação de preferência é chamada pelo cliente (anon).
[functions.mp-create-preference]
verify_jwt = false

# Mercado Pago webhook é chamado pelos servidores do MP, sem JWT.
# Verificação de assinatura é feita dentro da função (MP_WEBHOOK_SECRET).
[functions.mp-webhook]
verify_jwt = false

# Envio de e-mail transacional é chamado por outras edge functions e por webhooks.
[functions.send-order-email]
verify_jwt = false

# WhatsApp webhook é chamado pelos servidores da Meta, sem JWT.
# Verificação de assinatura (X-Hub-Signature-256) é feita dentro da função.
[functions.whatsapp-webhook]
verify_jwt = false

# Notificação de serviço no WhatsApp — chamada pelo painel (admin/editor logado).
# A própria função revalida o papel admin/editor.
[functions.service-notify]
verify_jwt = true
